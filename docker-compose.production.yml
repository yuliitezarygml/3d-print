services:
  nginx:
    ports: []

  caddy:
    image: caddy:2.10-alpine
    environment:
      PRINTFORGE_DOMAIN: ${PRINTFORGE_DOMAIN}
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped
    networks: [public]

volumes:
  caddy_data:
  caddy_config:
