[package]
name = "printforge-desktop"
version = "0.1.0"
description = "PrintForge desktop workshop manager"
authors = ["PrintForge contributors"]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.88"

[lib]
name = "printforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
genpdf = "0.2"
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
