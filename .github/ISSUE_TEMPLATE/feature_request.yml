name: Новая функция / Feature request
description: Предложить улучшение / Suggest an improvement for a 3D-printing workshop
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую проблему решаем? / What problem are we solving?
      description: Опишите реальный сценарий мастерской. / Describe a real workshop scenario.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Желаемый результат / Desired outcome
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы / Alternatives
  - type: dropdown
    id: area
    attributes:
      label: Раздел / Area
      options:
        - Заказы и клиенты / Orders and customers
        - Очередь и себестоимость / Queue and costing
        - Модели и файлы / Models and files
        - Склад / Inventory
        - Принтеры / Printers
        - Telegram
        - PDF и документы / PDF and documents
        - Развёртывание / Deployment
        - Другое / Other
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Участие / Contribution
      options:
        - label: Я готов помочь с реализацией или тестированием. / I can help implement or test this.
