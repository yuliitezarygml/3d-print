name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node scripts/check-doc-links.mjs

  backend:
    name: Go tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache-dependency-path: apps/backend/go.sum
      - run: gofmt -l . | tee /tmp/gofmt.txt && test ! -s /tmp/gofmt.txt
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  frontend:
    name: Next.js lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    name: Docker Compose and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - name: Wait for PrintForge
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://localhost/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=200
          exit 1
      - run: node tests/e2e/smoke.mjs
      - name: Install Playwright browser
        run: npm --prefix apps/frontend exec playwright install --with-deps chromium
      - name: Browser user journeys
        run: npm --prefix apps/frontend run test:e2e
      - name: Service logs
        if: always()
        run: docker compose logs --tail=200
      - name: Stop services
        if: always()
        run: docker compose down -v
