name: Desktop installers

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/backend/internal/http/printer_catalog.json"
      - "apps/backend/internal/http/assets/**"
      - "apps/frontend/public/printer-catalog/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/backend/internal/http/printer_catalog.json"
      - "apps/backend/internal/http/assets/**"
      - "apps/frontend/public/printer-catalog/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installers:
    name: ${{ matrix.name }} installer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            artifact: printforge-desktop-macos
            bundle: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows x64
            os: windows-latest
            artifact: printforge-desktop-windows-x64
            bundle: |
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Check Next.js frontend
        working-directory: apps/desktop
        run: npm run lint && npm run build

      - name: Test Rust core
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      - name: Build native installer
        working-directory: apps/desktop
        run: npm run desktop:build

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
          retention-days: 14
