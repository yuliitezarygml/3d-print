name: printforge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-printforge}
      POSTGRES_USER: ${POSTGRES_USER:-printforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-printforge_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-printforge} -d ${POSTGRES_DB:-printforge}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [internal]

  migrate:
    image: postgres:16-alpine
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-printforge}:${POSTGRES_PASSWORD:-printforge_local_password}@postgres:5432/${POSTGRES_DB:-printforge}?sslmode=disable
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-10}
    volumes:
      - ./apps/backend/migrations:/migrations:ro
      - ./scripts/migrate.sh:/scripts/migrate.sh:ro
    entrypoint: ["/bin/sh", "/scripts/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  backend:
    image: ${PRINTFORGE_BACKEND_IMAGE:-ghcr.io/yuliitezarygml/3d-print-backend:latest}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-printforge}:${POSTGRES_PASSWORD:-printforge_local_password}@postgres:5432/${POSTGRES_DB:-printforge}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-123456789}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000}
      UPLOAD_DIR: /data/uploads
      MAX_MODEL_FILE_SIZE_MB: ${MAX_MODEL_FILE_SIZE_MB:-200}
      MAX_IMAGE_FILE_SIZE_MB: ${MAX_IMAGE_FILE_SIZE_MB:-10}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_USE_SSL: ${S3_USE_SSL:-true}
    volumes:
      - uploads:/data/uploads
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [internal, public]

  frontend:
    image: ${PRINTFORGE_FRONTEND_IMAGE:-ghcr.io/yuliitezarygml/3d-print-frontend:latest}
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [public]

  nginx:
    image: nginx:1.29-alpine
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks: [public]

volumes:
  postgres_data:
  uploads:

networks:
  internal:
    internal: true
  public:
